server:
  port: 8081

spring:
  application:
    name: identity-service

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streambuted_identity}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

# ── gRPC server ─────────────────────────────────────────────────────────────
grpc:
  server:
    port: ${GRPC_PORT:9091}
    security:
      enabled: false          # TLS handled at the gateway/sidecar level

# ── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  issuer: ${JWT_ISSUER:http://identity-service:8081}
  key-id: ${JWT_KEY_ID:}
  rsa-private-key-pem: ${JWT_RSA_PRIVATE_KEY_PEM:}
  rsa-private-key-base64: ${JWT_RSA_PRIVATE_KEY_BASE64:}
  rsa-public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
  rsa-public-key-base64: ${JWT_RSA_PUBLIC_KEY_BASE64:}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

# ── RabbitMQ exchange / queue names ─────────────────────────────────────────
messaging:
  exchange:
    identity: identity.events
  routing-key:
    user-promoted: user.promoted
  queue:
    user-promoted: identity.user.promoted

# ── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    streambuted.identity: DEBUG
    org.springframework.security: WARN
