server:
  port: 8081

spring:
  application:
    name: identity-service

  # PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/streambuted_identity}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}

  mail:
    host: ${EMAIL_HOST:localhost}
    port: ${EMAIL_PORT:1025}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${EMAIL_SMTP_AUTH:false}
          starttls:
            enable: ${EMAIL_STARTTLS_ENABLE:false}
          ssl:
            enable: ${EMAIL_SECURE:false}

app:
  email:
    from: ${EMAIL_FROM:no-reply-streambuted@example.com}
    verification-subject: ${EMAIL_VERIFICATION_SUBJECT:StreamButed verification code}
  registration:
    verification-code-ttl: ${REGISTRATION_VERIFICATION_CODE_TTL:15m}
  security:
    refresh-cookie:
      path: ${REFRESH_COOKIE_PATH:/api/v1/auth/refresh}
      secure: ${REFRESH_COOKIE_SECURE:true}
  google:
    oauth:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      callback-url: ${GOOGLE_CALLBACK_URL:http://localhost/api/v1/auth/oauth/google/callback}
      frontend-url: ${FRONTEND_URL:http://localhost:5173}

# gRPC server
grpc:
  server:
    port: ${GRPC_PORT:9091}
    security:
      enabled: false          # TLS handled at the gateway/sidecar level

# JWT
jwt:
  issuer: ${JWT_ISSUER:http://identity-service:8081}
  audience: ${JWT_AUDIENCE:streambuted-api}
  key-id: ${JWT_KEY_ID:}
  rsa-private-key-pem: ${JWT_RSA_PRIVATE_KEY_PEM:}
  rsa-private-key-base64: ${JWT_RSA_PRIVATE_KEY_BASE64:}
  rsa-public-key-pem: ${JWT_RSA_PUBLIC_KEY_PEM:}
  rsa-public-key-base64: ${JWT_RSA_PUBLIC_KEY_BASE64:}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000} # 7 days

# RabbitMQ exchange / queue names
messaging:
  exchange:
    identity: identity.events
  routing-key:
    user-promoted: user.promoted
  queue:
    user-promoted: identity.user.promoted

media:
  grpc:
    target: ${MEDIA_GRPC_TARGET:media-service:9093}
    timeout-ms: ${MEDIA_GRPC_TIMEOUT_MS:2000}

# Actuator
management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    root: INFO
    streambuted.identity: INFO
    org.springframework.security: WARN
